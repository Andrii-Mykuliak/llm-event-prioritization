[project]
name = "llm-saliency-release"
version = "1.0.0"
description = "Reproducible pipeline: implicit event saliency of language models on Formula 1 event streams (main experiment and controlled timing-rank follow-up)"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "statsmodels>=0.14", "patsy>=0.5.6", "matplotlib>=3.8", "pillow>=10", "pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
inputs = ["fastf1==3.8.3"]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5", "nbconvert>=7"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
